<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Boost service - ZedEvents</title>
  <meta name="theme-color" content="#C2410C" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root { --bg:#F4F1EC; --card:#fff; --border:#E2E0DC; --text:#211D1A; --sub:#5C5955; --orange:#C2410C; --cream:#FFF3E8; --gold:#F5C518; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); }
    .topbar { background:var(--orange); padding:16px; display:flex; align-items:center; gap:12px; }
    .back { width:40px; height:40px; border:none; background:none; color:var(--cream); font-size:18px; }
    .title { color:var(--cream); font-size:18px; font-weight:700; }
    .content { padding:20px; max-width:480px; margin:0 auto; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
    .btn { width:100%; border:none; border-radius:12px; padding:14px; font-weight:700; cursor:pointer; }
    .btn-main { background:var(--orange); color:#fff; }
    .btn-alt { background:#111; color:var(--gold); margin-top:8px; }
    .sub { font-size:13px; color:var(--sub); line-height:1.45; margin-top:8px; }
    .credits { font-size:28px; font-weight:800; color:var(--orange); }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="back" type="button" onclick="history.back()">←</button>
    <div class="title">Boost</div>
  </div>
  <div class="content">
    <div class="card">
      <div>Free boost credits</div>
      <div class="credits" id="credits">—</div>
      <p class="sub">A boost puts this service at the top of Home for 24 hours.</p>
    </div>
    <button class="btn btn-main" type="button" id="creditBtn">Use 1 credit</button>
    <button class="btn btn-alt" type="button" id="requestBtn">Request a boost</button>
    <p class="sub" id="status"></p>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    if (!ZEAuth.requireLogin(location.pathname + location.search)) {}
    else if (!id) document.getElementById("status").textContent = "Missing service.";
    else {
      const creditsEl = document.getElementById("credits");
      const status = document.getElementById("status");
      async function load() {
        const data = await ZE.api("/boost/my-credits");
        creditsEl.textContent = data.free_featured_credits || 0;
      }
      load().catch(() => { creditsEl.textContent = "0"; });
      document.getElementById("creditBtn").onclick = async () => {
        try {
          await ZE.api(`/boost/${id}`, { method: "POST", body: JSON.stringify({ use_credit: true }) });
          ZEUI.toast("Boost is live for 24 hours.", "success");
          location.href = "/my-shop.html";
        } catch (err) {
          ZEUI.error(err.message || "Could not boost.");
        }
      };
      document.getElementById("requestBtn").onclick = async () => {
        try {
          await ZE.api(`/boost/${id}`, { method: "POST", body: JSON.stringify({}) });
          status.textContent = "Request sent. An admin will review it.";
          ZEUI.toast("Boost request sent.", "success");
        } catch (err) {
          ZEUI.error(err.message || "Could not request boost.");
        }
      };
    }
  </script>
</body>
</html>
