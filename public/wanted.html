<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Host - Wanted Board</title>
<meta name="theme-color" content="#111111" />
<script src="/js/prefs.js"></script>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --red-btn: #E01B27; --warn-bg: #FFF3E0; --warn-text: #7A3E00;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 40px; height: 40px; padding: 0;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .back-button svg {
    width: 22px; height: 22px; stroke: var(--gold); fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .header-title svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .my-posts-btn {
    background: rgba(245, 197, 24, 0.15); border: 1px solid rgba(245, 197, 24, 0.5); color: var(--gold);
    border-radius: 0; padding: 8px 12px; font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap;
    text-transform: uppercase; letter-spacing: 0.04em;
  }

  .explainer-box { background: var(--warn-bg); padding: 12px; margin: 14px 14px 0; border: 2px solid var(--text); }
  .explainer-text { font-size: 12px; color: var(--warn-text); line-height: 1.4; }

  .center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; }
  .empty-text { color: var(--subtext); text-align: center; margin-bottom: 16px; }
  .empty-btn { background: var(--black); color: var(--gold); border: none; padding: 12px 20px; border-radius: 0; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--price-red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .list { padding: 16px 16px calc(160px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1.5px solid var(--text); border-radius: 0;
    padding: 16px; margin-bottom: 16px;
  }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-title { font-size: 16px; font-weight: 800; flex: 1; }
  .card-budget { font-size: 16px; font-weight: 800; color: var(--price-red); }
  .card-desc { font-size: 13px; color: var(--subtext); margin-top: 8px; line-height: 1.45; }
  .card-meta-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .badge { background: var(--black); color: var(--gold); padding: 3px 8px; border-radius: 0; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .card-meta { font-size: 12px; color: var(--subtext); }
  .card-poster { font-size: 12px; color: var(--subtext); margin-top: 10px; }
  .card-photo {
    width: calc(100% + 32px); height: 160px; object-fit: cover; display: block;
    margin: -16px -16px 12px; border-bottom: 1.5px solid var(--text);
  }
  .respond-btn {
    margin-top: 14px; width: 100%; background: var(--card); color: var(--text);
    border: 2px solid var(--text); padding: 11px; font-size: 13px; font-weight: 800; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .close-btn {
    margin-top: 14px; width: 100%; background: #2F4F3E; color: #fff;
    border: none; padding: 11px; font-size: 13px; font-weight: 800; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .close-btn:disabled { opacity: 0.7; }

  .fab {
    position: fixed;
    left: 20px; right: 20px; max-width: 520px; margin: 0 auto;
    bottom: calc(72px + env(safe-area-inset-bottom, 0px));
    z-index: 55;
    background: var(--black); border: none; border-radius: 0; padding: 16px; text-align: center;
    color: var(--gold); font-weight: 800; font-size: 13px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.06em;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
</style>
</head>
<body data-nav-active="wanted" data-bar="black">

<div class="topbar">
  <button class="back-button" onclick="history.back()" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="header-title"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span data-i18n="wanted_board">Wanted Board</span></div>
  <button type="button" class="my-posts-btn" id="myWantedBtn" data-i18n="my_wanted_posts">My Posts</button>
</div>

<div class="explainer-box">
  <div class="explainer-text" data-i18n="wanted_explainer">Post the event service you need — a DJ, catering, tents — and vendors who can do it can message you.</div>
</div>

<div id="content"><div class="center-box"><div class="spinner"></div></div></div>

<button class="fab" id="postFab" data-i18n="post_wanted">+ Post What You Want</button>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/lang.js"></script>
<script src="/js/bottom-nav.js"></script>
<script>
  const content = document.getElementById("content");
  const user = ZEAuth.getUser();
  let posts = [];

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function formatBudget(budget) {
    if (budget == null || budget === "") return "";
    const n = Number(budget);
    if (Number.isNaN(n)) return "K" + escapeHtml(budget);
    return "K" + n.toLocaleString();
  }

  document.getElementById("myWantedBtn").addEventListener("click", () => {
    if (!ZEAuth.requireLogin("/my-wanted.html")) return;
    location.href = "/my-wanted.html";
  });
  document.getElementById("postFab").addEventListener("click", () => {
    if (!ZEAuth.requireLogin("/post-wanted.html")) return;
    location.href = "/post-wanted.html";
  });

  async function loadPosts() {
    try {
      const data = await ZE.api("/wanted");
      posts = Array.isArray(data) ? data : [];
      render();
    } catch (e) {
      content.innerHTML = `<div class="center-box"><div class="empty-text">${t("wanted_load_fail")}</div></div>`;
    }
  }

  function renderEmpty() {
    content.innerHTML = `
      <div class="center-box">
        <div class="empty-text">${t("wanted_empty")}</div>
        <button type="button" class="empty-btn" id="emptyPostBtn">${t("post_wanted")}</button>
      </div>`;
    document.getElementById("emptyPostBtn")?.addEventListener("click", () => {
      if (!ZEAuth.requireLogin("/post-wanted.html")) return;
      location.href = "/post-wanted.html";
    });
  }

  function render() {
    if (!posts.length) {
      renderEmpty();
      return;
    }
    content.innerHTML = `<div class="list">${posts.map(renderCard).join("")}</div>`;
    posts.forEach((post) => {
      const isMine = user && Number(post.user_id) === Number(user.id);
      const btn = document.getElementById(`action-${post.id}`);
      if (btn) {
        btn.addEventListener("click", () => isMine ? handleClosePost(post.id) : handleRespond(post));
      }
    });
  }

  function renderCard(post) {
    const isMine = user && Number(post.user_id) === Number(user.id);
    const hasMeta = post.category || post.location_label;
    const photos = Array.isArray(post.photos) ? post.photos.filter(Boolean) : [];
    const rawHero = photos[0] || "";
    const hero = rawHero && window.ZEPrefs ? ZEPrefs.optimizeImageUrl(rawHero, "card") : rawHero;
    const budget = formatBudget(post.budget);
    return `
      <div class="card">
        ${hero ? `<img class="card-photo" src="${escapeHtml(hero)}" alt="">` : ""}
        <div class="card-header">
          <div class="card-title">${escapeHtml(post.title)}</div>
          ${budget ? `<div class="card-budget">${budget}</div>` : ""}
        </div>
        ${post.description ? `<div class="card-desc">${escapeHtml(post.description)}</div>` : ""}
        ${hasMeta ? `<div class="card-meta-row">
          ${post.category ? `<div class="badge">${escapeHtml(post.category)}</div>` : ""}
          ${post.location_label ? `<div class="card-meta">${escapeHtml(post.location_label)}</div>` : ""}
        </div>` : ""}
        ${post.poster_name ? `<div class="card-poster">${escapeHtml(post.poster_name)}</div>` : ""}
        ${isMine
          ? `<button class="close-btn" id="action-${post.id}">${t("mark_found")}</button>`
          : `<button class="respond-btn" id="action-${post.id}">${t("wanted_i_have_this")}</button>`}
      </div>`;
  }

  function handleRespond(post) {
    if (!ZEAuth.requireLogin(location.pathname)) return;
    if (user && Number(post.user_id) === Number(user.id)) {
      ZEUI.toast(t("wanted_own_post"), "info");
      return;
    }
    const params = new URLSearchParams({ userId: String(post.user_id) });
    if (post.poster_name) params.set("name", post.poster_name);
    if (post.title) params.set("wantedTitle", post.title);
    if (post.budget) params.set("wantedBudget", String(post.budget));
    location.href = `/chat.html?${params.toString()}`;
  }

  async function handleClosePost(postId) {
    const ok = await ZEUI.confirm({
      title: t("mark_found"),
      message: t("wanted_close_confirm"),
      okText: t("mark_found"),
    });
    if (!ok) return;
    const btn = document.getElementById(`action-${postId}`);
    if (btn) { btn.disabled = true; btn.textContent = t("wanted_updating"); }
    try {
      await ZE.api(`/wanted/${postId}/close`, { method: "PUT" });
      posts = posts.filter((p) => String(p.id) !== String(postId));
      render();
    } catch (e) {
      ZEUI.error(t("wanted_update_fail"));
      if (btn) { btn.disabled = false; btn.textContent = t("mark_found"); }
    }
  }

  window.addEventListener("langchange", () => {
    if (!posts.length) renderEmpty();
    else render();
  });

  loadPosts();
</script>
</body>
</html>
