<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZedEvents - Service</title>
  <meta name="theme-color" content="#C2410C" />
  <script src="/js/prefs.js"></script>
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
      --text: #211D1A; --subtext: #5C5955; --orange: #C2410C;
      --cream: #FFF3E8; --peach: #FFD8B8; --black: #111111;
      --gold: #F5C518; --price-red: #B42318;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text);
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--orange); padding: 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .back-button {
      width: 40px; height: 40px; padding: 0; background: none; border: none;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .back-button svg {
      width: 22px; height: 22px; stroke: var(--cream); fill: none;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }
    .header-title { color: var(--cream); font-size: 18px; font-weight: 700; }
    .header-sub { color: var(--peach); font-size: 12px; margin-top: 2px; }
    .auth-btn {
      flex-shrink: 0; background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: 999px; padding: 8px 14px; color: #fff; font-size: 12px; font-weight: 700;
    }
    .center-box { padding: 60px 24px; text-align: center; color: var(--subtext); }
    .content { padding: 12px; max-width: 640px; margin: 0 auto; }
    .media-wrap { position: relative; margin-bottom: 10px; touch-action: pan-y; }
    .media-main {
      width: 100%; aspect-ratio: 4/3; border-radius: 14px; overflow: hidden;
      background: #FBEAD9;
    }
    .more-button {
      position: absolute; top: 10px; right: 10px; z-index: 10;
      width: 48px; height: 48px; border-radius: 24px;
      background: var(--black); border: none; padding: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .more-button svg { width: 22px; height: 22px; fill: var(--gold); display: block; }
    .media-main img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      -webkit-user-drag: none; user-select: none; pointer-events: none;
    }
    .media-thumbs {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 12px; max-width: 100%;
      overflow: hidden; touch-action: pan-y;
    }
    .media-thumbs img {
      width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0;
      border: 2px solid transparent; cursor: pointer;
      -webkit-user-drag: none; user-select: none;
    }
    .media-thumbs img.active { border-color: var(--orange); }
    .thumb-ph {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    }
    .thumb-ph svg {
      width: 64px; height: 64px; stroke: var(--orange); fill: none; opacity: 0.45;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    }
    .panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px;
    }
    .card-cat {
      font-size: 10px; font-weight: 700; color: var(--orange);
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .title { font-size: 22px; font-weight: 700; margin: 6px 0 4px; line-height: 1.25; }
    .vendor { font-size: 13px; color: var(--subtext); }
    .price { font-size: 20px; font-weight: 700; color: var(--orange); margin: 10px 0; }
    .location {
      font-size: 13px; color: var(--subtext); margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .location svg {
      width: 16px; height: 16px; stroke: var(--orange); fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
    }
    .desc { font-size: 14px; line-height: 1.55; color: var(--text); white-space: pre-wrap; }
    .menu-box {
      background: var(--bg); width: 100%; max-width: 480px;
      border-radius: 20px 20px 0 0;
      padding: 12px 12px calc(16px + env(safe-area-inset-bottom, 0px));
    }
    .menu-handle {
      width: 40px; height: 4px; background: var(--border); border-radius: 2px;
      margin: 4px auto 14px;
    }
    .menu-title {
      font-size: 13px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.04em; padding: 0 8px 10px;
    }
    .menu-row {
      display: flex; align-items: center; gap: 12px;
      width: 100%; background: var(--card); border: 2px solid var(--border);
      padding: 14px 12px; margin-bottom: 8px; cursor: pointer;
      font-size: 14px; font-weight: 700; color: var(--text); text-align: left;
    }
    .menu-row[hidden] { display: none; }
    .menu-row svg {
      width: 20px; height: 20px; stroke: var(--text); fill: none; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
    }
    .menu-row.danger { color: var(--price-red); }
    .menu-row.danger svg { stroke: var(--price-red); }
    .menu-cancel {
      width: 100%; margin-top: 4px; padding: 14px; background: var(--black);
      color: var(--gold); border: none; font-weight: 800; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer;
    }
    .fixed-cta-row {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      display: flex; gap: 10px;
      padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      background: var(--bg); border-top: 1px solid var(--border);
    }
    .fixed-cta-row[hidden] { display: none; }
    .cta-lab {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: none; padding: 0; color: var(--subtext);
      font-size: 10px; font-weight: 700; cursor: pointer;
    }
    .cta-lab.hidden { display: none; }
    .cta-btn {
      width: 100%; height: 48px; border-radius: 999px; background: #fff;
      border: 1px solid #D9D6D0; display: flex; align-items: center; justify-content: center;
    }
    .cta-lab svg {
      width: 22px; height: 22px; fill: none; stroke: var(--black);
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .cta-lab.saved svg { fill: var(--black); }
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200;
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--bg); width: 100%; max-width: 480px;
      border-radius: 0; border-top: 3px solid var(--black);
      padding: 20px 20px calc(16px + env(safe-area-inset-bottom, 0px));
    }
    .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; }
    .modal-warning { font-size: 12px; color: var(--subtext); margin-bottom: 12px; line-height: 1.4; }
    .modal-input {
      width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--text);
      border-radius: 0; padding: 10px 0; margin-bottom: 16px; font-size: 15px; color: var(--text);
    }
    .modal-actions { display: flex; gap: 10px; }
    .modal-cancel {
      flex: 1; background: var(--card); border: 2px solid var(--text); border-radius: 0;
      padding: 13px; font-weight: 800; text-transform: uppercase; font-size: 12px;
    }
    .modal-ok {
      flex: 1; background: var(--black); color: #F5C518; border: none; border-radius: 0;
      padding: 13px; font-weight: 800; text-transform: uppercase; font-size: 12px;
    }
    .verified-stamp {
      display: inline-flex; align-items: center; gap: 4px; margin-left: 6px;
      vertical-align: middle; line-height: 1; color: #146C3A;
      background: #E8F5EE; border-radius: 999px; padding: 2px 8px 2px 3px;
    }
    .verified-stamp .verified-mark { width: 15px; height: 15px; display: block; flex-shrink: 0; }
    .verified-stamp-label { font-size: 11px; font-weight: 700; letter-spacing: 0.02em; }
    .verified-stamp--icon { background: transparent; padding: 0; margin-left: 4px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <button class="back-button" type="button" onclick="history.back()" aria-label="Go back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div>
        <div class="header-title">Service</div>
        <div class="header-sub">Details</div>
      </div>
    </div>
    <a class="auth-btn" href="/login.html" id="authLink">Login</a>
  </div>

  <div id="status" class="center-box">Loading…</div>
  <div class="content" id="detail" hidden>
    <div class="media-wrap">
      <div class="media-main" id="mediaMain">
        <div class="thumb-ph"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 16-5-5-4 4-2-2-5 5"/></svg></div>
      </div>
      <button class="more-button" id="moreBtn" type="button" aria-label="More">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
    </div>
    <div class="media-thumbs" id="mediaThumbs" hidden></div>
    <div class="panel">
      <div class="card-cat" id="category">Service</div>
      <h1 class="title" id="title">—</h1>
      <div class="vendor" id="vendor">—</div>
      <div class="price" id="price">—</div>
      <div class="location" id="locationRow" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="location"></span>
      </div>
      <p class="desc" id="desc"></p>
    </div>
  </div>

  <div class="fixed-cta-row" id="ctaRow" hidden>
    <button type="button" class="cta-lab" id="msgBtn">
      <span class="cta-btn" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
      <span data-i18n="cta_message">Message</span>
    </button>
    <button type="button" class="cta-lab" id="bookBtn">
      <span class="cta-btn" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg></span>
      <span data-i18n="cta_book">Book</span>
    </button>
    <button type="button" class="cta-lab" id="shareBtn">
      <span class="cta-btn" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg></span>
      <span data-i18n="share">Share</span>
    </button>
    <button type="button" class="cta-lab" id="favBtn">
      <span class="cta-btn" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.3l8.8-8.6a5 5 0 0 0 0-7.1z"/></svg></span>
      <span data-i18n="cta_save">Save</span>
    </button>
  </div>

  <div class="modal-overlay" id="moreMenu">
    <div class="menu-box">
      <div class="menu-handle"></div>
      <div class="menu-title" data-i18n="more">More</div>
      <button class="menu-row" type="button" id="vendorLink">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span data-i18n="view_vendor">View vendor profile</span>
      </button>
      <button class="menu-row" type="button" id="rateBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span id="rateBtnLabel" data-i18n="rate_vendor">Rate this vendor</span>
      </button>
      <button class="menu-row danger" type="button" id="reportBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        <span data-i18n="report_service">Report this service</span>
      </button>
      <button class="menu-cancel" type="button" id="moreMenuCancel" data-i18n="cancel">Cancel</button>
    </div>
  </div>

  <div class="modal-overlay" id="bookModal">
    <div class="modal-box">
      <div class="modal-title" data-i18n="book_this">Book this</div>
      <div class="modal-warning" data-i18n="book_when_hint">The shop must confirm first. Optional date or area.</div>
      <input class="modal-input" id="bookDateInput" data-i18n-placeholder="book_when_ph" placeholder="e.g. 12 Oct, Lusaka" />
      <div class="modal-actions">
        <button class="modal-cancel" type="button" id="bookCancel">Cancel</button>
        <button class="modal-ok" type="button" id="bookConfirm" data-i18n="book_this">Book this</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/share.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const status = document.getElementById("status");
    const detail = document.getElementById("detail");
    let itemData = null;

    const user = ZEAuth.getUser();
    const authLink = document.getElementById("authLink");
    if (user) {
      authLink.textContent = "Account";
      authLink.href = "/settings.html";
    } else {
      authLink.href = `/login.html?next=${encodeURIComponent(location.pathname + location.search)}`;
    }

    function parsePhotos(photos) {
      if (!photos) return [];
      if (Array.isArray(photos)) return photos.filter(Boolean);
      if (typeof photos === "string") {
        try {
          const parsed = JSON.parse(photos);
          return Array.isArray(parsed) ? parsed.filter(Boolean) : [photos];
        } catch { return photos ? [photos] : []; }
      }
      return [];
    }

    function setMainPhoto(url) {
      document.getElementById("mediaMain").innerHTML = url
        ? `<img src="${url}" alt="" draggable="false" />`
        : `<div class="thumb-ph"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 16-5-5-4 4-2-2-5 5"/></svg></div>`;
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function load() {
      if (!id) {
        status.textContent = "Missing service id.";
        return;
      }
      try {
        itemData = await ZE.api(`/services/${id}`);
        status.hidden = true;
        detail.hidden = false;
        document.getElementById("ctaRow").hidden = false;
        document.getElementById("category").textContent = itemData.category || "Service";
        document.getElementById("title").textContent = itemData.title || "Untitled";
        document.getElementById("vendor").innerHTML =
          `${escapeHtml(itemData.business_name || itemData.vendor_name || "Vendor")}${typeof zeVerifiedStamp === "function" ? zeVerifiedStamp(itemData.is_verified) : ""}`;
        document.getElementById("price").textContent = ZE.formatPrice(itemData.price);
        document.getElementById("desc").textContent = itemData.description || "No description yet.";

        if (itemData.location_label) {
          document.getElementById("locationRow").hidden = false;
          document.getElementById("location").textContent = itemData.location_label;
        }

        const photos = parsePhotos(itemData.photos);
        if (photos.length) {
          setMainPhoto(photos[0]);
          if (photos.length > 1) {
            const thumbs = document.getElementById("mediaThumbs");
            thumbs.hidden = false;
            thumbs.innerHTML = photos.map((url, i) =>
              `<img src="${url}" alt="" class="${i === 0 ? "active" : ""}" data-i="${i}" loading="lazy" draggable="false" />`
            ).join("");
            thumbs.querySelectorAll("img").forEach((img) => {
              img.onclick = () => {
                thumbs.querySelectorAll("img").forEach((el) => el.classList.remove("active"));
                img.classList.add("active");
                setMainPhoto(img.src);
              };
            });
          }
        }

        const moreMenu = document.getElementById("moreMenu");
        const closeMoreMenu = () => moreMenu.classList.remove("open");
        document.getElementById("moreBtn").onclick = () => moreMenu.classList.add("open");
        document.getElementById("moreMenuCancel").onclick = closeMoreMenu;
        moreMenu.addEventListener("click", (e) => {
          if (e.target.id === "moreMenu") closeMoreMenu();
        });

        const vendorLink = document.getElementById("vendorLink");
        const rateBtn = document.getElementById("rateBtn");
        if (itemData.vendor_id) {
          vendorLink.onclick = () => {
            location.href = `/vendor.html?id=${itemData.vendor_id}`;
          };
          const rateLabel = document.getElementById("rateBtnLabel");
          if (rateLabel) rateLabel.textContent = typeof t === "function" ? t("rate_vendor") : "Rate this vendor";
          const me = ZEAuth.getUser();
          if (me && String(me.id) === String(itemData.vendor_id)) rateBtn.hidden = true;
          else {
            rateBtn.onclick = () => {
              if (!ZEAuth.requireLogin(location.pathname + location.search)) return;
              location.href = `/vendor.html?id=${itemData.vendor_id}&rate=1`;
            };
          }
        } else {
          vendorLink.hidden = true;
          rateBtn.hidden = true;
        }

        document.getElementById("shareBtn").onclick = () => ZEShare.shareService(itemData);
        document.getElementById("reportBtn").onclick = () => {
          if (!ZEAuth.requireLogin(location.pathname + location.search)) return;
          const phone = itemData.vendor_phone || "";
          location.href = `/report-user.html?phone=${encodeURIComponent(phone)}`;
        };

        document.getElementById("favBtn").onclick = async () => {
          if (!ZEAuth.requireLogin(location.pathname + location.search)) return;
          try {
            await ZE.api(`/favorites/${id}`, { method: "POST" });
            document.getElementById("favBtn").classList.add("saved");
            ZEUI.toast("Saved to favorites.", "success");
          } catch (err) {
            ZEUI.error(err.message || "Could not save favorite.");
          }
        };

        document.getElementById("msgBtn").onclick = () => {
          if (!itemData.vendor_id) {
            ZEUI.error("This service has no vendor to message.");
            return;
          }
          if (!ZEAuth.requireLogin(location.pathname + location.search)) return;
          const me = ZEAuth.getUser();
          if (me && String(me.id) === String(itemData.vendor_id)) {
            ZEUI.error("This is your own service.");
            return;
          }
          location.href = `/chat.html?userId=${itemData.vendor_id}`;
        };

        const bookBtn = document.getElementById("bookBtn");
        const bookModal = document.getElementById("bookModal");
        const meUser = ZEAuth.getUser();
        if (meUser && String(meUser.id) === String(itemData.vendor_id)) {
          bookBtn.classList.add("hidden");
        } else {
          bookBtn.onclick = () => {
            if (!ZEAuth.requireLogin(location.pathname + location.search)) return;
            bookModal.classList.add("open");
          };
        }
        document.getElementById("bookCancel").onclick = () => bookModal.classList.remove("open");
        bookModal.addEventListener("click", (e) => {
          if (e.target === bookModal) bookModal.classList.remove("open");
        });
        document.getElementById("bookConfirm").onclick = async () => {
          const confirmBtn = document.getElementById("bookConfirm");
          confirmBtn.disabled = true;
          try {
            await ZE.api("/bookings", {
              method: "POST",
              body: JSON.stringify({
                service_id: Number(id),
                event_date: document.getElementById("bookDateInput").value.trim() || null,
              }),
            });
            location.href = "/booked.html";
          } catch (err) {
            if (err.status === 409) {
              location.href = "/booked.html";
              return;
            }
            ZEUI.error(err.message || (typeof t === "function" ? t("book_fail") : "Could not book."));
            confirmBtn.disabled = false;
          }
        };
      } catch {
        status.textContent = "Could not load this service.";
      }
    }

    load();
  </script>
</body>
</html>
