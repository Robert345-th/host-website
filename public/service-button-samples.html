<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pick a service page layout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: #F4F1EC; color: #211D1A;
      padding-bottom: 96px;
    }
    button { font: inherit; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: #211D1A; padding: 16px;
    }
    .header-title { color: #fff; font-size: 18px; font-weight: 700; }
    .header-sub { color: #bbb; font-size: 12px; margin-top: 2px; }
    .intro {
      padding: 14px 16px 4px; font-size: 14px; color: #5C5955; line-height: 1.45;
    }
    .option {
      display: block; width: calc(100% - 24px); margin: 12px 12px 0;
      text-align: left; background: transparent; border: 2px solid #E2E0DC;
      border-radius: 16px; padding: 10px; cursor: pointer; color: inherit;
    }
    .option.picked { border-color: #211D1A; box-shadow: 0 0 0 3px rgba(17,17,17,0.12); }
    .option-kicker {
      font-size: 11px; font-weight: 800; letter-spacing: 0.04em;
      text-transform: uppercase; margin: 2px 4px 8px;
    }
    .option-note { font-size: 12px; color: #5C5955; margin: 8px 4px 4px; line-height: 1.4; }
    .phone { border: 1px solid #E2E0DC; border-radius: 12px; overflow: hidden; }
    .ph-bar {
      padding: 10px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .ph-bar strong { font-size: 14px; }
    .ph-bar small { display: block; font-size: 10px; opacity: 0.8; }
    .ph-acc {
      border: 1.5px solid currentColor; padding: 5px 10px;
      font-size: 11px; font-weight: 700; border-radius: 999px;
    }
    .photo {
      height: 88px; margin: 8px 8px 6px; border-radius: 10px;
      background: linear-gradient(160deg, #d7e8d2, #3f6b4a);
    }
    .thumbs { display: flex; gap: 6px; padding: 0 8px 8px; }
    .thumbs span { width: 36px; height: 36px; border-radius: 7px; background: #c5d4bf; display: block; }
    .panel { background: #fff; margin: 0 8px 8px; border: 1px solid #E2E0DC; border-radius: 12px; padding: 12px; }
    .cat { font-size: 10px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
    .svc { font-size: 16px; font-weight: 700; margin: 3px 0 4px; }
    .who { font-size: 12px; color: #5C5955; }
    .price { font-size: 16px; font-weight: 700; margin: 6px 0 4px; }
    .loc { font-size: 12px; color: #5C5955; }
    .desc { font-size: 12px; line-height: 1.4; margin-top: 6px; }
    .stack { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
    .row { display: flex; gap: 7px; margin-top: 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; border: none; padding: 11px 8px;
      font-size: 13px; font-weight: 700;
    }
    .btn.sm { padding: 9px 6px; font-size: 12px; }
    .icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .icon-act {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: #fff; border: 1px solid #E2E0DC; border-radius: 10px; padding: 8px 4px;
      font-size: 10px; font-weight: 700;
    }
    .icon-act svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .text-links {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 10px;
      font-size: 11px; font-weight: 700; color: #5C5955;
    }
    .vendor-chip {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px; padding: 8px 10px; border: 1px solid #E2E0DC; border-radius: 10px;
      font-size: 12px; font-weight: 700;
    }
    .sticky { display: flex; gap: 8px; padding: 8px; }
    .list-links { margin-top: 10px; }
    .list-links div {
      font-size: 13px; font-weight: 700; padding: 10px 0;
      border-bottom: 1px solid #E2E0DC;
    }
    .list-links div:last-child { border-bottom: none; color: #5C5955; }
    .more-peek { margin-top: 8px; border-radius: 10px; padding: 8px; }
    .more-peek div { font-size: 11px; font-weight: 700; padding: 7px 4px; border-bottom: 1px solid rgba(0,0,0,0.08); }
    .more-peek div:last-child { border-bottom: none; }
    .pick-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      background: #fff; border-top: 1px solid #E2E0DC;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .pick-bar strong { font-size: 14px; }
    .pick-bar span { font-size: 12px; color: #5C5955; }

    /* A blue */
    .a .option-kicker, .a .cat, .a .price { color: #1D4ED8; }
    .a .phone { background: #EEF3FF; }
    .a .ph-bar { background: #1D4ED8; color: #fff; }
    .a .ph-acc { color: #fff; }
    .a .btn.fill { background: #1D4ED8; color: #fff; border-radius: 12px; }
    .a .btn.line { background: #fff; color: #1D4ED8; border: 1.5px solid #1D4ED8; border-radius: 12px; }
    .a .icon-act { color: #1D4ED8; border-color: #BFDBFE; }

    /* B green */
    .b .option-kicker, .b .cat, .b .price { color: #157A3A; }
    .b .phone { background: #F1F8F3; }
    .b .ph-bar { background: #157A3A; color: #fff; }
    .b .ph-acc { color: #fff; }
    .b .btn.fill { background: #157A3A; color: #fff; border-radius: 12px; }
    .b .btn.line { background: #fff; color: #157A3A; border: 1.5px solid #157A3A; border-radius: 12px; }
    .b .icon-act { color: #157A3A; border-color: #BFE5CE; }
    .b .sticky { background: #fff; border-top: 1px solid #BFE5CE; }
    .b .vendor-chip span { color: #157A3A; }

    /* C gold / black */
    .c .option-kicker, .c .price { color: #111; }
    .c .cat { color: #8A6D00; }
    .c .phone { background: #F7F4EA; }
    .c .ph-bar { background: #111; color: #F5C518; }
    .c .ph-acc { color: #F5C518; border-radius: 0; }
    .c .btn.fill { background: #111; color: #F5C518; border-radius: 0; text-transform: uppercase; letter-spacing: 0.04em; font-size: 12px; }
    .c .btn.line { background: #fff; color: #111; border: 2px solid #111; border-radius: 0; text-transform: uppercase; letter-spacing: 0.04em; font-size: 12px; }
    .c .text-links { color: #8A6D00; }

    /* D brown / cream */
    .d .option-kicker, .d .cat, .d .price { color: #7C4A1E; }
    .d .phone { background: #F6EDE3; }
    .d .ph-bar { background: #7C4A1E; color: #FFF3E8; }
    .d .ph-acc { color: #FFF3E8; }
    .d .btn.fill { background: #7C4A1E; color: #FFF3E8; border-radius: 10px; }
    .d .btn.line { background: #FFF3E8; color: #7C4A1E; border: 1.5px solid #7C4A1E; border-radius: 10px; }

    /* E teal */
    .e .option-kicker, .e .cat, .e .price { color: #0F766E; }
    .e .phone { background: #EEF7F6; }
    .e .ph-bar { background: #0F766E; color: #fff; }
    .e .ph-acc { color: #fff; }
    .e .btn.fill { background: #0F766E; color: #fff; border-radius: 12px; }
    .e .btn.line { background: #fff; color: #0F766E; border: 1.5px solid #0F766E; border-radius: 12px; }
    .e .more-peek { background: #D5F0EC; }

    /* F purple */
    .f .option-kicker, .f .cat, .f .price { color: #6D28D9; }
    .f .phone { background: #F5F0FF; }
    .f .ph-bar { background: #6D28D9; color: #fff; }
    .f .ph-acc { color: #fff; }
    .f .btn.fill { background: #6D28D9; color: #fff; border-radius: 12px; }
    .f .icon-act { color: #6D28D9; border-color: #DDD6FE; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="header-title">Service page buttons</div>
    <div class="header-sub">Each letter is a different color.</div>
  </div>
  <p class="intro">A is blue, B is green, C is black and gold, D is brown, E is teal, F is purple. Layout changes with the color. Tap one, then reply with the letter.</p>

  <button class="option a" type="button" data-pick="A">
    <div class="option-kicker">A · Blue · two buttons + icons</div>
    <div class="phone">
      <div class="ph-bar"><div><strong>Service</strong><small>Details</small></div><div class="ph-acc">Account</div></div>
      <div class="photo"></div>
      <div class="thumbs"><span></span><span></span><span></span></div>
      <div class="panel">
        <div class="cat">Tents &amp; chairs</div>
        <div class="svc">White party tent, 100 guests</div>
        <div class="who">Banda Tents &amp; Chairs</div>
        <div class="price">K4,500</div>
        <div class="loc">Kitwe</div>
        <p class="desc">White tent for about 100 seated guests. Delivery and setup on the Copperbelt.</p>
        <div class="row">
          <div class="btn fill">Message</div>
          <div class="btn line">Book this</div>
        </div>
        <div class="icons">
          <div class="icon-act"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>Share</div>
          <div class="icon-act"><svg viewBox="0 0 24 24"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.3l8.8-8.6a5 5 0 0 0 0-7.1z"/></svg>Save</div>
          <div class="icon-act"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/></svg>Shop</div>
          <div class="icon-act"><svg viewBox="0 0 24 24"><polygon points="12 3 15 9 21.5 9.8 16.8 14.2 18.2 21 12 17.6 5.8 21 7.2 14.2 2.5 9.8 9 9"/></svg>Rate</div>
        </div>
        <div class="text-links"><span>Report this service</span></div>
      </div>
    </div>
    <p class="option-note">Bright blue. Message and Book sit side by side.</p>
  </button>

  <button class="option b" type="button" data-pick="B">
    <div class="option-kicker">B · Green · sticky bar</div>
    <div class="phone">
      <div class="ph-bar"><div><strong>Service</strong><small>Details</small></div><div class="ph-acc">Account</div></div>
      <div class="photo"></div>
      <div class="thumbs"><span></span><span></span><span></span></div>
      <div class="panel">
        <div class="cat">Tents &amp; chairs</div>
        <div class="svc">White party tent, 100 guests</div>
        <div class="who">Banda Tents &amp; Chairs</div>
        <div class="price">K4,500</div>
        <div class="loc">Kitwe</div>
        <p class="desc">White tent for about 100 seated guests. Delivery and setup on the Copperbelt.</p>
        <div class="vendor-chip">Banda Tents &amp; Chairs <span>View shop</span></div>
        <div class="icons">
          <div class="icon-act"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>Share</div>
          <div class="icon-act"><svg viewBox="0 0 24 24"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.3l8.8-8.6a5 5 0 0 0 0-7.1z"/></svg>Save</div>
          <div class="icon-act"><svg viewBox="0 0 24 24"><polygon points="12 3 15 9 21.5 9.8 16.8 14.2 18.2 21 12 17.6 5.8 21 7.2 14.2 2.5 9.8 9 9"/></svg>Rate</div>
          <div class="icon-act"><svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V4s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>Report</div>
        </div>
      </div>
      <div class="sticky">
        <div class="btn line">Book this</div>
        <div class="btn fill">Message</div>
      </div>
    </div>
    <p class="option-note">Forest green. Book and Message stay on the bottom.</p>
  </button>

  <button class="option c" type="button" data-pick="C">
    <div class="option-kicker">C · Black and gold · two buttons + links</div>
    <div class="phone">
      <div class="ph-bar"><div><strong>Service</strong><small>Details</small></div><div class="ph-acc">Account</div></div>
      <div class="photo"></div>
      <div class="thumbs"><span></span><span></span><span></span></div>
      <div class="panel">
        <div class="cat">Tents &amp; chairs</div>
        <div class="svc">White party tent, 100 guests</div>
        <div class="who">Banda Tents &amp; Chairs</div>
        <div class="price">K4,500</div>
        <div class="loc">Kitwe</div>
        <p class="desc">White tent for about 100 seated guests. Delivery and setup on the Copperbelt.</p>
        <div class="stack">
          <div class="btn fill">Message vendor</div>
          <div class="btn line">Book this</div>
        </div>
        <div class="text-links">
          <span>Share</span><span>Save</span><span>Shop</span><span>Rate</span><span>Report</span>
        </div>
      </div>
    </div>
    <p class="option-note">Gold on black, square corners. Extra actions are text links.</p>
  </button>

  <button class="option d" type="button" data-pick="D">
    <div class="option-kicker">D · Brown · two-column grid</div>
    <div class="phone">
      <div class="ph-bar"><div><strong>Service</strong><small>Details</small></div><div class="ph-acc">Account</div></div>
      <div class="photo"></div>
      <div class="thumbs"><span></span><span></span><span></span></div>
      <div class="panel">
        <div class="cat">Tents &amp; chairs</div>
        <div class="svc">White party tent, 100 guests</div>
        <div class="who">Banda Tents &amp; Chairs</div>
        <div class="price">K4,500</div>
        <div class="loc">Kitwe</div>
        <p class="desc">White tent for about 100 seated guests. Delivery and setup on the Copperbelt.</p>
        <div class="stack" style="margin-bottom:7px;">
          <div class="btn fill">Message vendor</div>
        </div>
        <div class="grid2">
          <div class="btn line sm">Book this</div>
          <div class="btn line sm">Share</div>
          <div class="btn line sm">Save</div>
          <div class="btn line sm">View shop</div>
          <div class="btn line sm">Rate</div>
          <div class="btn line sm">Report</div>
        </div>
      </div>
    </div>
    <p class="option-note">Coffee brown and cream. Message full width, the rest in pairs.</p>
  </button>

  <button class="option e" type="button" data-pick="E">
    <div class="option-kicker">E · Teal · two buttons + More</div>
    <div class="phone">
      <div class="ph-bar"><div><strong>Service</strong><small>Details</small></div><div class="ph-acc">Account</div></div>
      <div class="photo"></div>
      <div class="thumbs"><span></span><span></span><span></span></div>
      <div class="panel">
        <div class="cat">Tents &amp; chairs</div>
        <div class="svc">White party tent, 100 guests</div>
        <div class="who">Banda Tents &amp; Chairs</div>
        <div class="price">K4,500</div>
        <div class="loc">Kitwe</div>
        <p class="desc">White tent for about 100 seated guests. Delivery and setup on the Copperbelt.</p>
        <div class="stack">
          <div class="btn fill">Message vendor</div>
          <div class="btn line">Book this</div>
          <div class="btn line">More</div>
        </div>
        <div class="more-peek">
          <div>Share</div>
          <div>Save to favorites</div>
          <div>View vendor profile</div>
          <div>Rate this vendor</div>
          <div>Report this service</div>
        </div>
      </div>
    </div>
    <p class="option-note">Teal. Only Message, Book, and More on the page.</p>
  </button>

  <button class="option f" type="button" data-pick="F">
    <div class="option-kicker">F · Purple · one button + icons</div>
    <div class="phone">
      <div class="ph-bar"><div><strong>Service</strong><small>Details</small></div><div class="ph-acc">Account</div></div>
      <div class="photo"></div>
      <div class="thumbs"><span></span><span></span><span></span></div>
      <div class="panel">
        <div class="cat">Tents &amp; chairs</div>
        <div class="svc">White party tent, 100 guests</div>
        <div class="who">Banda Tents &amp; Chairs</div>
        <div class="price">K4,500</div>
        <div class="loc">Kitwe</div>
        <p class="desc">White tent for about 100 seated guests. Delivery and setup on the Copperbelt.</p>
        <div class="stack">
          <div class="btn fill">Message vendor</div>
        </div>
        <div class="icons">
          <div class="icon-act"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Book</div>
          <div class="icon-act"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>Share</div>
          <div class="icon-act"><svg viewBox="0 0 24 24"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.3l8.8-8.6a5 5 0 0 0 0-7.1z"/></svg>Save</div>
          <div class="icon-act"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/></svg>Shop</div>
        </div>
        <div class="text-links"><span>Rate this vendor</span><span>Report</span></div>
      </div>
    </div>
    <p class="option-note">Purple. One Message button. Book sits with the icons.</p>
  </button>

  <div class="pick-bar">
    <strong id="picked">No pick yet</strong>
    <div><span>Reply with A, B, C, D, E, or F.</span></div>
  </div>
  <script>
    const picked = document.getElementById("picked");
    document.querySelectorAll(".option").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".option").forEach((el) => el.classList.remove("picked"));
        btn.classList.add("picked");
        picked.textContent = "You picked " + btn.dataset.pick;
      });
    });
  </script>
</body>
</html>
