<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shop name - ZedEvents</title>
  <meta name="theme-color" content="#C2410C" />
  <style>
    :root { --bg:#F4F1EC; --card:#fff; --border:#E2E0DC; --text:#211D1A; --orange:#C2410C; --cream:#FFF3E8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); }
    .topbar { background:var(--orange); padding:16px; display:flex; align-items:center; gap:12px; }
    .back { width:40px; height:40px; border:none; background:none; color:var(--cream); }
    .title { color:var(--cream); font-size:18px; font-weight:700; }
    .content { padding:16px; max-width:480px; margin:0 auto; }
    input { width:100%; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; font:inherit; }
    .btn { width:100%; margin-top:14px; background:var(--orange); color:#fff; border:none; border-radius:12px; padding:14px; font-weight:700; }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="back" type="button" onclick="history.back()">←</button>
    <div class="title">Shop name</div>
  </div>
  <div class="content">
    <input id="name" maxlength="80" />
    <button class="btn" type="button" id="save">Save</button>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    if (!ZEAuth.requireLogin("/edit-shop-name.html")) {}
    else {
      (async () => {
        const p = await ZE.api("/auth/vendor-profile");
        document.getElementById("name").value = p.business_name || "";
      })();
      document.getElementById("save").onclick = async () => {
        const business_name = document.getElementById("name").value.trim();
        if (!business_name) { ZEUI.error("Enter a shop name."); return; }
        await ZE.api("/auth/vendor-profile", { method: "PUT", body: JSON.stringify({ business_name }) });
        const user = ZEAuth.getUser() || {};
        ZEAuth.setSession(ZEAuth.getToken(), { ...user, business_name });
        ZEUI.toast("Shop name saved.", "success");
        location.href = "/edit-shop-profile.html";
      };
    }
  </script>
</body>
</html>
