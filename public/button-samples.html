<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Button samples</title>
  <style>
    :root {
      --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
      --text: #211D1A; --subtext: #5C5955; --black: #111111;
      --gold: #F5C518;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text);
      padding: 16px 16px 96px;
    }
    h1 { font-size: 18px; font-weight: 800; }
    .lead { font-size: 14px; color: var(--subtext); line-height: 1.45; margin: 6px 0 16px; }
    .sample {
      display: block; width: 100%; text-align: left; color: inherit;
      background: var(--card); border: 2px solid var(--border);
      border-radius: 14px; padding: 14px; margin-bottom: 14px; cursor: pointer;
    }
    .sample.picked { border-color: var(--black); }
    .kicker {
      font-size: 11px; font-weight: 800; letter-spacing: 0.04em;
      text-transform: uppercase; margin-bottom: 10px;
    }
    .note { font-size: 12px; color: var(--subtext); margin-top: 10px; line-height: 1.4; }

    .deal-row { display: flex; gap: 10px; }
    .deal-btn {
      flex: 1; background: var(--black); color: var(--gold); border: none;
      border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 800;
    }
    .notify-btn {
      flex: 1; background: var(--card); border: 1.5px solid var(--text); color: var(--text);
      border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 800;
    }
    .seller-actions { display: flex; gap: 12px; margin-top: 10px; }
    .view-shop-btn, .review-btn {
      flex: 1; padding: 11px 12px; border-radius: 12px; font-size: 12px; font-weight: 800; border: none;
    }
    .view-shop-btn { background: var(--black); color: var(--gold); }
    .review-btn { background: var(--card); color: var(--text); border: 1.5px solid var(--text); }

    .fixed-cta-row {
      display: flex; gap: 10px; margin-top: 12px;
      padding: 10px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    }
    .cta-btn {
      flex: 1; height: 48px; padding: 0; border-radius: 999px; background: #fff;
      border: 1px solid #D9D6D0; display: flex; align-items: center; justify-content: center;
    }
    .cta-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--black); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .cta-btn.dark { background: var(--black); border-color: var(--black); }
    .cta-btn.dark svg { stroke: var(--gold); }
    .cta-lab {
      display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1;
      font-size: 10px; font-weight: 700; color: var(--subtext);
    }
    .cta-lab .cta-btn { width: 100%; }

    .pick-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      background: #fff; border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .pick-bar strong { font-size: 14px; }
    .pick-bar span { font-size: 12px; color: var(--subtext); }
  </style>
</head>
<body>
  <h1>Button samples</h1>
  <p class="lead">ZedMarket listing layout, without the red and green fills. Black, gold, and white only. Live pages are not changed.</p>

  <button class="sample" type="button" data-pick="A">
    <div class="kicker">A · White rounds</div>
    <div class="fixed-cta-row">
      <div class="cta-lab">
        <div class="cta-btn"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        Message
      </div>
      <div class="cta-lab">
        <div class="cta-btn"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg></div>
        Book
      </div>
      <div class="cta-lab">
        <div class="cta-btn"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg></div>
        Share
      </div>
      <div class="cta-lab">
        <div class="cta-btn"><svg viewBox="0 0 24 24"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.3l8.8-8.6a5 5 0 0 0 0-7.1z"/></svg></div>
        Save
      </div>
    </div>
    <p class="note">Four white circles, black icons. Same bar as the listing page.</p>
  </button>

  <button class="sample" type="button" data-pick="B">
    <div class="kicker">B · Black message, white rest</div>
    <div class="fixed-cta-row">
      <div class="cta-lab">
        <div class="cta-btn dark"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        Message
      </div>
      <div class="cta-lab">
        <div class="cta-btn"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg></div>
        Book
      </div>
      <div class="cta-lab">
        <div class="cta-btn"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg></div>
        Share
      </div>
      <div class="cta-lab">
        <div class="cta-btn"><svg viewBox="0 0 24 24"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.3l8.8-8.6a5 5 0 0 0 0-7.1z"/></svg></div>
        Save
      </div>
    </div>
    <p class="note">Message is black with a gold icon. The others stay white.</p>
  </button>

  <button class="sample" type="button" data-pick="C">
    <div class="kicker">C · Black and gold pair, then white rounds</div>
    <div class="deal-row">
      <div class="deal-btn">Book this</div>
      <div class="notify-btn">Message</div>
    </div>
    <div class="fixed-cta-row">
      <div class="cta-lab">
        <div class="cta-btn"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg></div>
        Share
      </div>
      <div class="cta-lab">
        <div class="cta-btn"><svg viewBox="0 0 24 24"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.3l8.8-8.6a5 5 0 0 0 0-7.1z"/></svg></div>
        Save
      </div>
      <div class="cta-lab">
        <div class="cta-btn"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/></svg></div>
        Shop
      </div>
      <div class="cta-lab">
        <div class="cta-btn"><svg viewBox="0 0 24 24"><polygon points="12 3 15 9 21.5 9.8 16.8 14.2 18.2 21 12 17.6 5.8 21 7.2 14.2 2.5 9.8 9 9"/></svg></div>
        Rate
      </div>
    </div>
    <p class="note">Book and Message like Make offer / Notify on ZedMarket. Share, Save, Shop, Rate as white rounds.</p>
  </button>

  <button class="sample" type="button" data-pick="D">
    <div class="kicker">D · Shop and rate in the seller pair</div>
    <div class="seller-actions" style="margin-top:0;">
      <div class="view-shop-btn">View shop</div>
      <div class="review-btn">Rate vendor</div>
    </div>
    <div class="fixed-cta-row">
      <div class="cta-lab">
        <div class="cta-btn dark"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        Message
      </div>
      <div class="cta-lab">
        <div class="cta-btn"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg></div>
        Book
      </div>
      <div class="cta-lab">
        <div class="cta-btn"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg></div>
        Share
      </div>
      <div class="cta-lab">
        <div class="cta-btn"><svg viewBox="0 0 24 24"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.3l8.8-8.6a5 5 0 0 0 0-7.1z"/></svg></div>
        Save
      </div>
    </div>
    <p class="note">View shop and Rate like the ZedMarket seller row. Contact bar underneath.</p>
  </button>

  <div class="pick-bar">
    <strong id="picked">No pick yet</strong>
    <div><span>Reply with A, B, C, or D. Live listings are not changed.</span></div>
  </div>
  <script>
    const picked = document.getElementById("picked");
    document.querySelectorAll(".sample").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sample").forEach((el) => el.classList.remove("picked"));
        btn.classList.add("picked");
        picked.textContent = "You picked " + btn.dataset.pick;
      });
    });
  </script>
</body>
</html>
