<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Host - Booked</title>
<meta name="theme-color" content="#111111" />
<script src="/js/prefs.js"></script>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --red-btn: #E01B27; --warn-bg: #FFF3E0; --warn-text: #7A3E00;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 40px; height: 40px; padding: 0;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .back-button svg {
    width: 22px; height: 22px; stroke: var(--gold); fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .header-title svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .explainer-box { background: var(--warn-bg); padding: 12px; margin: 14px 14px 0; border: 2px solid var(--text); }
  .explainer-text { font-size: 12px; color: var(--warn-text); line-height: 1.4; }

  .center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; }
  .empty-text { color: var(--subtext); text-align: center; margin-bottom: 16px; }
  .empty-btn { background: var(--black); color: var(--gold); border: none; padding: 12px 20px; border-radius: 0; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--price-red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .list { padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1.5px solid var(--text); border-radius: 0;
    padding: 16px; margin-bottom: 16px;
  }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-title { font-size: 16px; font-weight: 800; flex: 1; }
  .card-meta { font-size: 12px; color: var(--subtext); margin-top: 8px; line-height: 1.45; }
  .card-meta-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .badge { background: var(--black); color: var(--gold); padding: 3px 8px; border-radius: 0; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .badge.pending { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--text); }
  .badge.done { background: #2F4F3E; color: #fff; }
  .badge.cancelled { background: var(--subtext); color: #fff; }
  .confirm-btn { background: var(--black); color: var(--gold); border: none; }
  .card-photo {
    width: calc(100% + 32px); height: 140px; object-fit: cover; display: block;
    margin: -16px -16px 12px; border-bottom: 1.5px solid var(--text);
  }
  .btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .action-btn {
    flex: 1; min-width: 110px; border-radius: 0; padding: 11px; font-weight: 800; font-size: 12px;
    cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .msg-btn { background: var(--card); color: var(--text); border: 2px solid var(--text); }
  .done-btn { background: #2F4F3E; color: #fff; border: none; }
  .cancel-btn { background: var(--card); color: var(--price-red); border: 2px solid var(--text); }
  .action-btn:disabled { opacity: 0.7; }
</style>
</head>
<body data-nav-active="booked" data-bar="black">

<div class="topbar">
  <button class="back-button" onclick="history.back()" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="header-title"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span data-i18n="booked">Booked</span></div>
</div>

<div class="explainer-box">
  <div class="explainer-text" data-i18n="booked_explainer">Ask to book a service. It stays pending until the shop confirms.</div>
</div>

<div id="content"><div class="center-box"><div class="spinner"></div></div></div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/lang.js"></script>
<script src="/js/bottom-nav.js"></script>
<script>
  const content = document.getElementById("content");
  let bookings = [];

  if (!ZEAuth.requireLogin("/booked.html")) {
    /* redirected */
  } else {
    loadBookings();
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function firstPhoto(photos) {
    if (window.ZE && ZE.firstPhoto) return ZE.firstPhoto(photos);
    if (Array.isArray(photos)) return photos[0] || "";
    return "";
  }

  async function loadBookings() {
    try {
      const data = await ZE.api("/bookings");
      bookings = Array.isArray(data) ? data : [];
      render();
    } catch (e) {
      content.innerHTML = `<div class="center-box"><div class="empty-text">${t("booked_load_fail")}</div></div>`;
    }
  }

  function renderEmpty() {
    content.innerHTML = `
      <div class="center-box">
        <div class="empty-text">${t("booked_empty")}</div>
        <button type="button" class="empty-btn" onclick="location.href='/'">${t("booked_browse")}</button>
      </div>`;
  }

  function statusLabel(status) {
    if (status === "pending") return t("booked_status_pending");
    if (status === "done") return t("booked_status_done");
    if (status === "cancelled" || status === "declined") return t("booked_status_cancelled");
    return t("booked_status_booked");
  }

  function badgeClass(status) {
    if (status === "pending") return "pending";
    if (status === "done") return "done";
    if (status === "cancelled" || status === "declined") return "cancelled";
    return "";
  }

  function renderCard(row) {
    const isVendor = row.role === "vendor";
    const otherName = isVendor ? row.customer_name : row.vendor_name;
    const otherId = isVendor ? row.customer_id : row.vendor_id;
    const hero = firstPhoto(row.service_photos);
    const pending = row.status === "pending";
    const confirmed = row.status === "booked";
    return `
      <div class="card">
        ${hero ? `<img class="card-photo" src="${escapeHtml(hero)}" alt="">` : ""}
        <div class="card-header">
          <div class="card-title">${escapeHtml(row.service_title || t("booked"))}</div>
        </div>
        <div class="card-meta">${escapeHtml(isVendor ? t("booked_from") : t("booked_with"))}: ${escapeHtml(otherName || "")}</div>
        ${row.event_date ? `<div class="card-meta">${escapeHtml(t("booked_when"))}: ${escapeHtml(row.event_date)}</div>` : ""}
        ${row.notes ? `<div class="card-meta">${escapeHtml(row.notes)}</div>` : ""}
        ${pending ? `<div class="card-meta">${escapeHtml(isVendor ? t("booked_needs_you") : t("booked_waiting"))}</div>` : ""}
        <div class="card-meta-row">
          <div class="badge ${badgeClass(row.status)}">${escapeHtml(statusLabel(row.status))}</div>
          <div class="badge">${escapeHtml(isVendor ? t("booked_role_vendor") : t("booked_role_customer"))}</div>
        </div>
        <div class="btn-row">
          <button type="button" class="action-btn msg-btn" data-chat="${otherId}">${t("messages")}</button>
          ${pending && isVendor ? `<button type="button" class="action-btn confirm-btn" data-confirm="${row.id}">${t("booked_confirm")}</button>` : ""}
          ${pending && isVendor ? `<button type="button" class="action-btn cancel-btn" data-decline="${row.id}">${t("booked_decline")}</button>` : ""}
          ${pending && !isVendor ? `<button type="button" class="action-btn cancel-btn" data-cancel="${row.id}">${t("booked_cancel")}</button>` : ""}
          ${confirmed ? `<button type="button" class="action-btn done-btn" data-done="${row.id}">${t("booked_mark_done")}</button>` : ""}
          ${confirmed ? `<button type="button" class="action-btn cancel-btn" data-cancel="${row.id}">${t("booked_cancel")}</button>` : ""}
        </div>
      </div>`;
  }

  function render() {
    const visible = bookings.filter((b) => b.status !== "cancelled" && b.status !== "declined");
    if (!visible.length) {
      renderEmpty();
      return;
    }
    content.innerHTML = `<div class="list">${visible.map(renderCard).join("")}</div>`;
    content.querySelectorAll("[data-chat]").forEach((btn) => {
      btn.addEventListener("click", () => {
        location.href = `/chat.html?userId=${btn.dataset.chat}`;
      });
    });
    content.querySelectorAll("[data-done]").forEach((btn) => {
      btn.addEventListener("click", () => setStatus(btn.dataset.done, "done"));
    });
    content.querySelectorAll("[data-cancel]").forEach((btn) => {
      btn.addEventListener("click", () => setStatus(btn.dataset.cancel, "cancel"));
    });
    content.querySelectorAll("[data-confirm]").forEach((btn) => {
      btn.addEventListener("click", () => setStatus(btn.dataset.confirm, "confirm"));
    });
    content.querySelectorAll("[data-decline]").forEach((btn) => {
      btn.addEventListener("click", () => setStatus(btn.dataset.decline, "decline"));
    });
  }

  async function setStatus(id, action) {
    const copy = {
      confirm: { title: t("booked_confirm"), message: t("booked_confirm_ask"), ok: t("booked_confirm") },
      decline: { title: t("booked_decline"), message: t("booked_decline_ask"), ok: t("booked_decline"), danger: true },
      done: { title: t("booked_mark_done"), message: t("booked_done_confirm"), ok: t("booked_mark_done") },
      cancel: { title: t("booked_cancel"), message: t("booked_cancel_confirm"), ok: t("booked_cancel"), danger: true },
    }[action];
    const ok = await ZEUI.confirm({
      title: copy.title,
      message: copy.message,
      okText: copy.ok,
      danger: !!copy.danger,
    });
    if (!ok) return;
    try {
      await ZE.api(`/bookings/${id}/${action}`, { method: "PUT" });
      loadBookings();
    } catch (err) {
      ZEUI.error(err.message || t("booked_update_fail"));
    }
  }

  window.addEventListener("langchange", () => {
    if (!bookings.filter((b) => b.status !== "cancelled" && b.status !== "declined").length) renderEmpty();
    else render();
  });
</script>
</body>
</html>
