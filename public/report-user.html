<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Report a user - ZedEvents</title>
  <meta name="theme-color" content="#C2410C" />
  <script src="/js/prefs.js"></script>
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root { --bg:#F4F1EC; --card:#fff; --border:#E2E0DC; --text:#211D1A; --sub:#5C5955; --orange:#C2410C; --cream:#FFF3E8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); }
    .topbar { background:var(--orange); padding:16px; display:flex; align-items:center; gap:12px; }
    .back { width:40px; height:40px; border:none; background:none; color:var(--cream); }
    .title { color:var(--cream); font-size:18px; font-weight:700; }
    .content { padding:16px; max-width:480px; margin:0 auto; }
    label { display:block; font-size:12px; font-weight:700; color:var(--sub); margin:12px 0 6px; }
    input, textarea, select {
      width:100%; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; font:inherit;
    }
    .btn { width:100%; margin-top:16px; background:var(--orange); color:#fff; border:none; border-radius:12px; padding:14px; font-weight:700; }
    .chip-row { display:flex; gap:8px; }
    .chip { flex:1; border:1px solid var(--border); background:var(--card); border-radius:10px; padding:10px; font-weight:700; }
    .chip.on { background:var(--orange); color:#fff; border-color:var(--orange); }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="back" type="button" onclick="history.back()">←</button>
    <div class="title">Report a user</div>
  </div>
  <div class="content">
    <label>Who are you reporting?</label>
    <div class="chip-row">
      <button class="chip on" type="button" data-role="vendor">Vendor</button>
      <button class="chip" type="button" data-role="customer">Customer</button>
    </div>
    <label>Phone</label>
    <input id="phone" type="tel" placeholder="097..." />
    <label>Reason</label>
    <select id="reason">
      <option value="scam">Scam or fraud</option>
      <option value="abuse">Abuse or harassment</option>
      <option value="spam">Spam</option>
      <option value="other">Other</option>
    </select>
    <label>Details (optional)</label>
    <textarea id="details" rows="4" placeholder="What happened?"></textarea>
    <button class="btn" type="button" id="send">Submit report</button>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    if (!ZEAuth.requireLogin("/report-user.html")) {}
    else {
      let role = "vendor";
      document.querySelectorAll("[data-role]").forEach((b) => {
        b.onclick = () => {
          role = b.dataset.role;
          document.querySelectorAll("[data-role]").forEach((x) => x.classList.toggle("on", x === b));
        };
      });
      const pre = new URLSearchParams(location.search).get("phone");
      if (pre) document.getElementById("phone").value = pre;
      document.getElementById("send").onclick = async () => {
        const phone = document.getElementById("phone").value.trim();
        const reason = document.getElementById("reason").value;
        const details = document.getElementById("details").value.trim();
        if (!phone) { ZEUI.error("Enter the phone number."); return; }
        try {
          await ZE.api("/user-reports", {
            method: "POST",
            body: JSON.stringify({ reported_phone: phone, reported_role: role, reason: details ? `${reason}: ${details}` : reason }),
          });
          ZEUI.toast("Report sent.", "success");
          history.back();
        } catch (err) {
          ZEUI.error(err.message || "Could not submit report.");
        }
      };
    }
  </script>
</body>
</html>
