<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Referrals - Host</title>
  <meta name="theme-color" content="#C2410C" />
  <script src="/js/prefs.js"></script>
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root { --bg:#F4F1EC; --card:#fff; --border:#E2E0DC; --text:#211D1A; --sub:#5C5955; --orange:#C2410C; --cream:#FFF3E8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); }
    .topbar { background:var(--orange); padding:16px; display:flex; align-items:center; gap:12px; }
    .back { width:40px; height:40px; border:none; background:none; color:var(--cream); }
    .title { color:var(--cream); font-size:18px; font-weight:700; }
    .content { padding:20px; max-width:480px; margin:0 auto; text-align:center; }
    .code { font-size:32px; font-weight:800; letter-spacing:0.12em; margin:16px 0; }
    .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:16px 0; }
    .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; }
    .stat n { display:block; font-size:20px; font-weight:800; color:var(--orange); }
    .stat s { font-size:11px; color:var(--sub); }
    .btn { width:100%; background:var(--orange); color:#fff; border:none; border-radius:12px; padding:14px; font-weight:700; cursor:pointer; }
    .sub { font-size:13px; color:var(--sub); line-height:1.45; }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="back" type="button" onclick="history.back()">←</button>
    <div class="title" data-i18n="referrals">Referrals</div>
  </div>
  <div class="content">
    <p class="sub">Share your code. When a friend registers a shop, you both get a free boost credit.</p>
    <div class="code" id="code">————</div>
    <div class="stats">
      <div class="stat"><n id="total">0</n><s>Invites</s></div>
      <div class="stat"><n id="vendors">0</n><s>Shops</s></div>
      <div class="stat"><n id="credits">0</n><s>Credits</s></div>
    </div>
    <button class="btn" type="button" id="shareBtn">Share code</button>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/lang.js"></script>
  <script>
    if (!ZEAuth.requireLogin("/referrals.html")) {}
    else {
      (async () => {
        const data = await ZE.api("/auth/referral-info");
        document.getElementById("code").textContent = data.referral_code || "————";
        document.getElementById("total").textContent = data.total_referrals || 0;
        document.getElementById("vendors").textContent = data.vendor_referrals || 0;
        document.getElementById("credits").textContent = data.free_featured_credits || 0;
        document.getElementById("shareBtn").onclick = async () => {
          const text = `Join Host with my code ${data.referral_code} — ${location.origin}`;
          try {
            if (navigator.share) await navigator.share({ title: "Host", text });
            else {
              await navigator.clipboard.writeText(text);
              ZEUI.toast("Code copied.", "success");
            }
          } catch {}
        };
      })().catch((err) => ZEUI.error(err.message || "Could not load referrals."));
    }
  </script>
</body>
</html>
