<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZedEvents - Vendor</title>
  <meta name="theme-color" content="#C2410C" />
  <script src="/js/prefs.js"></script>
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
      --text: #211D1A; --subtext: #5C5955; --orange: #C2410C;
      --cream: #FFF3E8; --peach: #FFD8B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text); padding-bottom: 24px;
    }
    button { font: inherit; cursor: pointer; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--orange); padding: 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .back-button {
      width: 40px; height: 40px; padding: 0; background: none; border: none;
      display: flex; align-items: center; justify-content: center;
    }
    .back-button svg {
      width: 22px; height: 22px; stroke: var(--cream); fill: none;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }
    .header-title { color: var(--cream); font-size: 18px; font-weight: 700; }
    .header-sub { color: var(--peach); font-size: 12px; margin-top: 2px; }
    .center-box { padding: 60px 24px; text-align: center; color: var(--subtext); }
    .content { padding: 12px; max-width: 640px; margin: 0 auto; }
    .profile-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
    }
    .profile-head { display: flex; gap: 14px; align-items: center; }
    .avatar {
      width: 72px; height: 72px; border-radius: 14px; background: #FBEAD9;
      overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; color: var(--orange);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name { font-size: 20px; font-weight: 700; }
    .profile-type { font-size: 12px; color: var(--subtext); margin-top: 2px; }
    .verified-stamp {
      display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 800;
      color: #1F7A43; background: #E7F5EC; border-radius: 999px; padding: 1px 7px;
    }
    .follow-row { display: flex; gap: 8px; margin-top: 12px; }
    .ghost-btn {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; font-weight: 700;
    }
    .ghost-btn.on { background: #E7F5EC; color: #1F7A43; border-color: #BFE5CE; }
    .counts { font-size: 12px; color: var(--subtext); margin-top: 8px; }
    .bio { font-size: 14px; line-height: 1.55; color: var(--text); margin-top: 14px; }
    .section-label {
      font-size: 11px; font-weight: 700; color: var(--subtext);
      text-transform: uppercase; margin: 16px 0 8px;
    }
    .review {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; margin-bottom: 8px;
    }
    .review-stars { font-size: 14px; font-weight: 700; color: var(--orange); }
    .review-text { font-size: 13px; color: var(--text); margin-top: 6px; line-height: 1.45; }
    .review-meta { font-size: 11px; color: var(--subtext); margin-top: 6px; }
    .empty-text { font-size: 13px; color: var(--subtext); text-align: center; padding: 16px; }
    .primary-btn {
      width: 100%; margin-top: 14px; background: var(--orange); border: none;
      border-radius: 12px; padding: 14px; color: #fff; font-weight: 700; font-size: 15px;
    }
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--bg); width: 100%; max-width: 480px;
      border-radius: 20px 20px 0 0; padding: 20px 20px calc(16px + env(safe-area-inset-bottom));
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
    .stars-row { display: flex; gap: 6px; margin: 8px 0 12px; }
    .star-btn { background: none; border: none; font-size: 28px; color: #D9C9B8; cursor: pointer; }
    .star-btn.on { color: var(--orange); }
    .modal-input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; min-height: 80px; margin-bottom: 12px; font: inherit;
    }
    .modal-actions { display: flex; gap: 10px; }
    .modal-cancel, .modal-ok {
      flex: 1; border: none; border-radius: 12px; padding: 13px; font-weight: 700; cursor: pointer;
    }
    .modal-cancel { background: var(--card); border: 1px solid var(--border); color: var(--text); }
    .modal-ok { background: var(--orange); color: #fff; }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="back-button" type="button" onclick="history.back()" aria-label="Go back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div>
      <div class="header-title">Vendor</div>
      <div class="header-sub">Profile & reviews</div>
    </div>
  </div>

  <div id="status" class="center-box">Loading…</div>
  <div class="content" id="content" hidden>
    <div class="profile-card">
      <div class="profile-head">
        <div class="avatar" id="avatar">V</div>
        <div>
          <div class="profile-name" id="name">—</div>
          <div class="profile-type">Event vendor <span id="verified"></span></div>
          <div class="counts" id="counts"></div>
        </div>
      </div>
      <p class="bio" id="bio"></p>
      <div class="follow-row">
        <button type="button" class="ghost-btn" id="followBtn" hidden>Follow</button>
        <button type="button" class="primary-btn" id="msgBtn" hidden style="margin-top:0;flex:1;">Message</button>
      </div>
      <button type="button" class="ghost-btn" id="rateBtn" hidden style="width:100%;margin-top:8px;">Rate this vendor</button>
    </div>
    <div class="section-label">Reviews</div>
    <div id="reviews"></div>
  </div>

  <div class="modal-overlay" id="reviewModal">
    <div class="modal-box">
      <div class="modal-title" data-i18n="rate_vendor_title">Rate vendor</div>
      <div class="stars-row" id="starsRow"></div>
      <textarea class="modal-input" id="reviewComment" data-i18n-placeholder="review_comment_ph" placeholder="Leave a comment (optional)"></textarea>
      <div class="modal-actions">
        <button class="modal-cancel" type="button" id="reviewCancel" data-i18n="cancel">Cancel</button>
        <button class="modal-ok" type="button" id="reviewSubmit" data-i18n="submit">Submit</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/lang.js"></script>
  <script>
    const vendorId = new URLSearchParams(location.search).get("id");
    const status = document.getElementById("status");
    const content = document.getElementById("content");

    function esc(str) {
      return String(str || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    (async () => {
      if (!vendorId) {
        status.textContent = "Missing vendor id.";
        return;
      }
      try {
        const [profile, reviews] = await Promise.all([
          ZE.api(`/reviews/vendor/${vendorId}/profile`),
          ZE.api(`/reviews/vendor/${vendorId}`),
        ]);
        status.hidden = true;
        content.hidden = false;

        const name = profile.business_name || profile.name || "Vendor";
        document.getElementById("name").textContent = name;
        document.getElementById("bio").textContent = profile.business_bio || "No bio yet.";
        if (profile.is_verified) {
          document.getElementById("verified").innerHTML = '<span class="verified-stamp">✓ Verified</span>';
        }
        const avatar = document.getElementById("avatar");
        if (profile.business_photo_url) {
          avatar.innerHTML = `<img src="${esc(profile.business_photo_url)}" alt="" />`;
        } else {
          avatar.textContent = name.charAt(0).toUpperCase();
        }

        const me = ZEAuth.getUser();
        const msgBtn = document.getElementById("msgBtn");
        const followBtn = document.getElementById("followBtn");
        const isOwner = me && String(me.id) === String(vendorId);

        function paintCounts(counts) {
          document.getElementById("counts").innerHTML =
            `<a href="/following.html?id=${vendorId}&tab=followers">${counts.followers || 0} followers</a> · <a href="/following.html?id=${vendorId}&tab=following">${counts.following || 0} following</a>`;
        }

        if (!isOwner) {
          followBtn.hidden = false;
          const rateBtn = document.getElementById("rateBtn");
          rateBtn.hidden = false;
          rateBtn.textContent = typeof t === "function" ? t("rate_vendor") : "Rate this vendor";
          let picked = 0;
          const starsRow = document.getElementById("starsRow");
          starsRow.innerHTML = [1,2,3,4,5].map((n) => `<button type="button" class="star-btn" data-n="${n}">★</button>`).join("");
          function paintStars() {
            starsRow.querySelectorAll(".star-btn").forEach((b) => b.classList.toggle("on", Number(b.dataset.n) <= picked));
          }
          starsRow.querySelectorAll(".star-btn").forEach((b) => {
            b.onclick = () => { picked = Number(b.dataset.n); paintStars(); };
          });
          rateBtn.onclick = () => {
            if (!ZEAuth.requireLogin(location.pathname + location.search)) return;
            document.getElementById("reviewModal").classList.add("open");
          };
          if (me && new URLSearchParams(location.search).get("rate") === "1") {
            document.getElementById("reviewModal").classList.add("open");
          }
          document.getElementById("reviewCancel").onclick = () => document.getElementById("reviewModal").classList.remove("open");
          document.getElementById("reviewSubmit").onclick = async () => {
            if (!picked) { ZEUI.error("Pick a star rating."); return; }
            try {
              await ZE.api(`/reviews/vendor/${vendorId}`, {
                method: "POST",
                body: JSON.stringify({ rating: picked, comment: document.getElementById("reviewComment").value.trim() }),
              });
              document.getElementById("reviewModal").classList.remove("open");
              ZEUI.toast(typeof t === "function" ? t("review_thanks") : "Thanks for your review.", "success");
              location.reload();
            } catch (err) {
              ZEUI.error(err.message || (typeof t === "function" ? t("review_fail") : "Could not submit review."));
            }
          };
          if (me) {
            msgBtn.hidden = false;
            msgBtn.onclick = () => {
              if (!ZEAuth.requireLogin(location.pathname + location.search)) return;
              location.href = `/chat.html?userId=${vendorId}`;
            };
          }
          async function refreshFollow() {
            try {
              const countsP = ZE.api(`/follows/counts/${vendorId}`);
              const stP = me ? ZE.api(`/follows/status/${vendorId}`) : Promise.resolve({ following: false });
              const [st, counts] = await Promise.all([stP, countsP]);
              followBtn.textContent = st.following
                ? (typeof t === "function" ? t("following") : "Following")
                : (typeof t === "function" ? t("follow") : "Follow");
              followBtn.classList.toggle("on", !!st.following);
              paintCounts(counts);
            } catch { /* ignore */ }
          }
          followBtn.onclick = async () => {
            if (!ZEAuth.requireLogin(location.pathname + location.search)) return;
            const following = followBtn.classList.contains("on");
            await ZE.api(`/follows/${vendorId}`, { method: following ? "DELETE" : "POST" });
            refreshFollow();
          };
          refreshFollow();
        } else {
          ZE.api(`/follows/counts/${vendorId}`).then(paintCounts).catch(() => {});
        }

        const box = document.getElementById("reviews");
        const reviewList = Array.isArray(reviews) ? reviews : (reviews.reviews || []);
        if (!reviewList.length) {
          box.innerHTML = `<div class="empty-text">${typeof t === "function" ? t("no_reviews") : "No reviews yet."}</div>`;
        } else {
          box.innerHTML = reviewList.map((r) => `
            <div class="review">
              <div class="review-stars">${"★".repeat(r.rating || 0)}${"☆".repeat(5 - (r.rating || 0))}</div>
              <div class="review-text">${esc(r.comment || "No comment.")}</div>
              ${r.reviewer_name ? `<div class="review-meta">${esc(r.reviewer_name)}</div>` : ""}
            </div>`).join("");
        }
      } catch {
        status.textContent = "Could not load vendor.";
      }
    })();
  </script>
</body>
</html>
