<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Saved searches - Host</title>
  <meta name="theme-color" content="#C2410C" />
  <script src="/js/prefs.js"></script>
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root { --bg:#F4F1EC; --card:#fff; --border:#E2E0DC; --text:#211D1A; --sub:#5C5955; --orange:#C2410C; --cream:#FFF3E8; --red:#A3131C; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); }
    .topbar { background:var(--orange); padding:16px; display:flex; align-items:center; gap:12px; }
    .back { width:40px; height:40px; border:none; background:none; color:var(--cream); }
    .title { color:var(--cream); font-size:18px; font-weight:700; }
    .content { padding:16px; max-width:560px; margin:0 auto; }
    .row { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; gap:10px; }
    .name { font-weight:700; }
    .sub { font-size:12px; color:var(--sub); margin-top:3px; }
    .del { border:none; background:none; color:var(--red); font-weight:700; cursor:pointer; }
    .empty { text-align:center; color:var(--sub); padding:40px 12px; line-height:1.45; }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="back" type="button" onclick="history.back()">←</button>
    <div class="title" data-i18n="saved_searches">Saved searches</div>
  </div>
  <div class="content" id="app"><div class="empty">Loading…</div></div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/lang.js"></script>
  <script>
    if (!ZEAuth.requireLogin("/saved-searches.html")) {}
    else {
      async function load() {
        const app = document.getElementById("app");
        try {
          const rows = await ZE.api("/saved-searches");
          if (!rows.length) {
            app.innerHTML = `<div class="empty">No saved searches yet. Search on Home, then tap Notify me of new matches.</div>`;
            return;
          }
          app.innerHTML = rows.map((r) => {
            const bits = [r.query, r.category && r.category !== "All" ? r.category : "", r.city, r.max_price ? `max K${r.max_price}` : ""].filter(Boolean);
            return `<div class="row"><div><div class="name">${esc(r.query || r.category || "Search")}</div><div class="sub">${esc(bits.join(" · "))}</div></div><button class="del" type="button" data-id="${r.id}">Remove</button></div>`;
          }).join("");
          app.querySelectorAll("[data-id]").forEach((btn) => {
            btn.onclick = async () => {
              await ZE.api(`/saved-searches/${btn.dataset.id}`, { method: "DELETE" });
              load();
            };
          });
        } catch (err) {
          app.innerHTML = `<div class="empty">${esc(err.message || "Could not load.")}</div>`;
        }
      }
      function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
      load();
    }
  </script>
</body>
</html>
