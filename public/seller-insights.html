<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shop insights - ZedEvents</title>
  <meta name="theme-color" content="#C2410C" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root { --bg:#F4F1EC; --card:#fff; --border:#E2E0DC; --text:#211D1A; --sub:#5C5955; --orange:#C2410C; --cream:#FFF3E8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); }
    .topbar { background:var(--orange); padding:16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; }
    .back { width:40px; height:40px; border:none; background:none; color:var(--cream); }
    .title { color:var(--cream); font-size:18px; font-weight:700; }
    .content { padding:16px; max-width:560px; margin:0 auto; }
    .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:16px; }
    .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; text-align:center; }
    .stat n { display:block; font-size:20px; font-weight:800; color:var(--orange); }
    .stat s { font-size:11px; color:var(--sub); }
    .row { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:8px; }
    .row-t { font-weight:700; font-size:14px; }
    .row-m { font-size:12px; color:var(--sub); margin-top:4px; }
    .empty { text-align:center; color:var(--sub); padding:40px 16px; }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="back" type="button" onclick="history.back()" aria-label="Back">←</button>
    <div class="title">Insights</div>
  </div>
  <div class="content" id="app"><div class="empty">Loading…</div></div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (!ZEAuth.requireLogin("/seller-insights.html")) {}
    else {
      (async () => {
        const app = document.getElementById("app");
        try {
          const data = await ZE.api("/insights");
          const listings = data.listings || [];
          app.innerHTML = `
            <div class="stats">
              <div class="stat"><n>${data.views || 0}</n><s>Views</s></div>
              <div class="stat"><n>${data.chats || 0}</n><s>Chats</s></div>
              <div class="stat"><n>${data.saves || 0}</n><s>Saves</s></div>
              <div class="stat"><n>${data.followers || 0}</n><s>Followers</s></div>
              <div class="stat"><n>${data.active || 0}</n><s>Live</s></div>
              <div class="stat"><n>${listings.filter((l) => l.is_boosted).length}</n><s>Boosted</s></div>
            </div>
            ${listings.length ? listings.map((l) => `
              <a class="row" href="/service.html?id=${l.id}" style="display:block;color:inherit;text-decoration:none;">
                <div class="row-t">${esc(l.title)}</div>
                <div class="row-m">${l.view_count || 0} views · ${l.chats || 0} chats · ${l.saves || 0} saves${l.is_boosted ? " · Boosted" : ""}</div>
              </a>`).join("") : `<div class="empty">No live services yet.</div>`}`;
        } catch (err) {
          app.innerHTML = `<div class="empty">${esc(err.message || "Could not load insights.")}</div>`;
        }
      })();
    }
    function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  </script>
</body>
</html>
